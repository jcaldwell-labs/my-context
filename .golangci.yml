version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - unconvert
    - unparam
    - gosec
    - bodyclose
    - gocritic
    - gocyclo
    - dupl
    - prealloc

  settings:
    gocyclo:
      min-complexity: 15

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - commentFormatting

    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false
        - name: var-naming
          disabled: false

    misspell:
      locale: US

    gosec:
      excludes:
        - G204
        - G304

    dupl:
      threshold: 100

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
