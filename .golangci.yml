version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - unconvert
    - unparam
    - gosec
    - bodyclose
    - gocritic
    - gocyclo
    - dupl
    - prealloc

  settings:
    gocyclo:
      min-complexity: 15

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - commentFormatting
        - ifElseChain
        - emptyStringTest
        - paramTypeCombine

    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

    misspell:
      locale: US

    gosec:
      excludes:
        - G104
        - G204
        - G304
        - G301
        - G306

    dupl:
      threshold: 100

  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - gocritic
          - prealloc
      - path: tests/
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - prealloc
      - path: cmd/my-context/main.go
        linters:
          - gocyclo
      - path: internal/commands/
        linters:
          - gocyclo
      - path: internal/filters/
        linters:
          - dupl
      - linters:
          - prealloc
        text: "Consider preallocating"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
